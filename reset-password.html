<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BETHAG — Reimposta password</title>
<style>
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#111827;min-height:100vh;display:grid;place-items:center}
.card{width:min(420px,calc(100% - 32px));background:#fff;border-radius:18px;padding:28px;box-shadow:0 18px 50px #0001}
h1{margin:0 0 10px;font-size:25px}p{color:#64748b;line-height:1.5}
label{display:block;margin:18px 0 7px;font-weight:600}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:700;font-size:16px;cursor:pointer}
button:disabled{opacity:.6}.error{margin-top:15px;padding:11px;border-radius:9px;background:#fee2e2;color:#991b1b}.ok{margin-top:15px;padding:11px;border-radius:9px;background:#dcfce7;color:#166534}
.logo{font-weight:800;font-size:28px;margin-bottom:20px}
</style>
</head>
<body>
<div class="card">
<div class="logo">BETHAG</div>
<h1>Reimposta la password</h1>
<p id="intro">Inserisci la nuova password per il tuo account BETHAG.</p>
<form id="form" hidden>
<label for="password">Nuova password</label>
<input id="password" type="password" minlength="8" autocomplete="new-password" required>
<label for="confirm">Conferma nuova password</label>
<input id="confirm" type="password" minlength="8" autocomplete="new-password" required>
<button id="save" type="submit">Salva nuova password</button>
</form>
<div id="message"></div>
</div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.117.1";

const SUPABASE_URL = "https://tctcgptrsmvgajqjgnev.supabase.co";
const SUPABASE_KEY = "sb_publishable_VTickP6SdwCWp-3oUNSleA_UuA307iJ";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "pkce" }
});

const form=document.getElementById("form");
const message=document.getElementById("message");
const save=document.getElementById("save");
const intro=document.getElementById("intro");

function showError(text){message.className="error";message.textContent=text}
function showOk(text){message.className="ok";message.textContent=text}

let ready=false;
supabase.auth.onAuthStateChange((event, session)=>{
  if(event==="PASSWORD_RECOVERY" && session){
    ready=true; form.hidden=false; intro.textContent="Inserisci la nuova password per completare il recupero.";
  }
});

async function init(){
  const url=new URL(location.href);
  const code=url.searchParams.get("code");
  if(code){
    const {error}=await supabase.auth.exchangeCodeForSession(code);
    if(error){showError("Il link di recupero non è più valido. Richiedi un nuovo link.");return}
  }
  const {data,error}=await supabase.auth.getSession();
  if(error){showError(error.message);return}
  if(data.session){ready=true;form.hidden=false;intro.textContent="Inserisci la nuova password per completare il recupero."}
  else if(!code && !location.hash.includes("access_token")){
    showError("Link di recupero non valido o scaduto. Richiedi un nuovo link.");
  }
}
await init();

form.addEventListener("submit",async e=>{
  e.preventDefault();
  const password=document.getElementById("password").value;
  const confirm=document.getElementById("confirm").value;
  if(password.length<8){showError("La password deve contenere almeno 8 caratteri.");return}
  if(password!==confirm){showError("Le password non coincidono.");return}
  if(!ready){showError("La sessione di recupero non è disponibile. Richiedi un nuovo link.");return}
  save.disabled=true; save.textContent="Aggiornamento in corso…";
  const {error}=await supabase.auth.updateUser({password});
  if(error){showError(error.message);save.disabled=false;save.textContent="Salva nuova password";return}
  await supabase.auth.signOut({scope:"local"});
  form.hidden=true;
  showOk("Password aggiornata correttamente. Ora puoi accedere a BETHAG.");
  setTimeout(()=>{location.href="./";},900);
});
</script>
</body>
</html>
