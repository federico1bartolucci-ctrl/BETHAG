<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%bethag.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%bethag.svg" />
    <meta
      name="description"
      content="BETHAG - Gestione intelligente per amministratori di condominio"
    />
    <title>BETHAG</title>
    <script>
      (() => {
        const url = new URL(window.location.href);
        const hash = new URLSearchParams(url.hash.slice(1));
        const isInvite = url.searchParams.get("type") === "invite" || hash.get("type") === "invite";
        if (!isInvite) return;
        const target = new URL("./invite-accept.html", url.href);
        target.search = url.search;
        target.hash = url.hash;
        window.location.replace(target.toString());
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
