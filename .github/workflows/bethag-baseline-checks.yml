name: BETHAG baseline safety checks

on:
  push:
    branches:
      - rebuild/bethag-clean-20261017
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  baseline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify migration baseline and ACL safety
        run: npm run verify:baseline
      - name: Test clean bootstrap
        run: npm test
      - name: Build application
        run: npm run build
