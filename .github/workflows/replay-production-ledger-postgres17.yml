name: Replay Production ledger candidate on Supabase PostgreSQL 17

on:
  pull_request:
    branches: ["main"]
    paths:
      - "supabase/replay-candidate/**"
      - "supabase/replay-baseline/**"
      - ".github/workflows/replay-production-ledger-postgres17.yml"
  push:
    branches: ["recovery/production-ledger-archive-20261103"]
    paths:
      - "supabase/replay-candidate/**"
      - "supabase/replay-baseline/**"
      - ".github/workflows/replay-production-ledger-postgres17.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ledger-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_TELEMETRY_DISABLED: "true"
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Create disposable local Supabase project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bethag-production-ledger-replay
          cd /tmp/bethag-production-ledger-replay
          supabase init
          test -f supabase/config.toml
          grep -q '^major_version = ' supabase/config.toml
          sed -i '/^\[db\]/,/^\[/{s/^major_version = .*/major_version = 17/;}' supabase/config.toml
          grep -A8 '^\[db\]' supabase/config.toml

      - name: Stage exact recovered migration payloads
        shell: bash
        run: |
          set -euo pipefail
          target=/tmp/bethag-production-ledger-replay/supabase/migrations
          mkdir -p "$target"
          cp supabase/replay-baseline/*.sql "$target/"
          cp supabase/replay-candidate/*.sql "$target/"
          baseline_count=$(find supabase/replay-baseline -maxdepth 1 -type f -name '*.sql' | wc -l)
          candidate_count=$(find supabase/replay-candidate -maxdepth 1 -type f -name '*.sql' | wc -l)
          staged_count=$(find "$target" -maxdepth 1 -type f -name '*.sql' | wc -l)
          test "$baseline_count" -eq 15
          test "$candidate_count" -eq 247
          test "$staged_count" -eq 262
          echo "Staged $baseline_count chronological replay prerequisites plus $candidate_count exact Production-ledger payloads ($staged_count total)."

      - name: Start disposable Supabase stack
        working-directory: /tmp/bethag-production-ledger-replay
        shell: bash
        run: |
          set -euo pipefail
          supabase start --debug 2>&1 | tee /tmp/bethag-production-ledger-replay/start.log

      - name: Replay all 247 migrations on PostgreSQL 17
        working-directory: /tmp/bethag-production-ledger-replay
        shell: bash
        run: |
          set -euo pipefail
          supabase db reset --local --debug 2>&1 | tee /tmp/bethag-production-ledger-replay/replay.log

      - name: Upload replay diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres17-replay-diagnostics
          path: |
            /tmp/bethag-production-ledger-replay/start.log
            /tmp/bethag-production-ledger-replay/replay.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop disposable Supabase stack
        if: always()
        working-directory: /tmp/bethag-production-ledger-replay
        run: supabase stop --no-backup || true
