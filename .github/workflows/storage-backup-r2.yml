name: BETHAG Storage backup to Cloudflare R2

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  # Run once after a reviewed change to the backup implementation/workflow reaches main.
  push:
    branches: [main]
    paths:
      - ".github/workflows/storage-backup-r2.yml"
      - "scripts/backup-supabase-storage-to-r2.mjs"
      - "scripts/storage-backup-list-all.mjs"

permissions:
  contents: read

concurrency:
  group: bethag-storage-backup-r2
  cancel-in-progress: false

jobs:
  backup:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: storage-backup-production
    steps:
      - name: Check backup activation gate
        if: vars.STORAGE_BACKUP_ENABLED != 'true'
        run: echo "Storage backup disabled; set STORAGE_BACKUP_ENABLED=true in this Environment after cost approval."
      - uses: actions/checkout@v4
        if: vars.STORAGE_BACKUP_ENABLED == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: vars.STORAGE_BACKUP_ENABLED == 'true'
        with:
          node-version: 24
      - name: Install isolated AWS S3 client
        if: vars.STORAGE_BACKUP_ENABLED == 'true'
        run: npm install --no-save --package-lock=false @aws-sdk/client-s3@3.800.0
      - name: Validate backup credentials
        if: vars.STORAGE_BACKUP_ENABLED == 'true'
        env:
          SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          SUPABASE_STORAGE_BUCKET: bethag-documents
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_READ_TOKEN: ${{ secrets.CLOUDFLARE_R2_READ_TOKEN }}
        run: |
          node --input-type=module -e '
            const required = ["SUPABASE_S3_ENDPOINT","SUPABASE_S3_REGION","SUPABASE_S3_ACCESS_KEY_ID","SUPABASE_S3_SECRET_ACCESS_KEY","R2_ACCOUNT_ID","R2_BUCKET","R2_ACCESS_KEY_ID","R2_SECRET_ACCESS_KEY","CLOUDFLARE_R2_READ_TOKEN"];
            const missing = required.filter((name) => !process.env[name]);
            if (missing.length) { console.error("Missing GitHub Environment secrets: " + missing.join(", ")); process.exit(1); }
            console.log("All required secret names are present; values are not printed.");
          '
      - name: Back up Supabase Storage to immutable R2 snapshots
        if: vars.STORAGE_BACKUP_ENABLED == 'true'
        env:
          SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          SUPABASE_STORAGE_BUCKET: bethag-documents
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_READ_TOKEN: ${{ secrets.CLOUDFLARE_R2_READ_TOKEN }}
        run: node scripts/backup-supabase-storage-to-r2.mjs
