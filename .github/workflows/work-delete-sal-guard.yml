name: Work deletion SAL guard

on:
  pull_request:
    paths:
      - "supabase/migrations/20261124250000_prevent_work_delete_with_progress.sql"
      - "supabase/migrations/20261124202340_prevent_work_delete_with_progress.sql"
      - "scripts/test-work-delete-with-sal-guard.sh"
      - "scripts/work-delete-with-sal-guard.test.mjs"
      - ".github/workflows/work-delete-sal-guard.yml"
  push:
    branches: ["main"]
    paths:
      - "supabase/migrations/20261124250000_prevent_work_delete_with_progress.sql"
      - "supabase/migrations/20261124202340_prevent_work_delete_with_progress.sql"
      - "scripts/test-work-delete-with-sal-guard.sh"
      - "scripts/work-delete-with-sal-guard.test.mjs"
      - ".github/workflows/work-delete-sal-guard.yml"

jobs:
  postgres-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bethag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bethag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bethag_test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run npm test with PostgreSQL 17 regression
        run: npm test
