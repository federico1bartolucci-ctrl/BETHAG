name: Browser smoke

on:
  push:
    branches:
      - fix/production-acl-provider-baseline-disposition-20261108

permissions:
  contents: read

concurrency:
  group: bethag-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the locked Playwright version
        run: npx playwright install --with-deps chromium

      - name: Run public browser smoke
        run: npm run test:browser-smoke
