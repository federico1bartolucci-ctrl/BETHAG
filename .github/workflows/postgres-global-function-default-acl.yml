name: PostgreSQL global function default ACL regression

on:
  pull_request:
    paths:
      - "supabase/migrations/20261124234000_revoke_postgres_global_public_function_execute.sql"
      - "scripts/postgres-global-function-default-acl-regression.sql"
      - ".github/workflows/postgres-global-function-default-acl.yml"
  push:
    branches: ["main"]
    paths:
      - "supabase/migrations/20261124234000_revoke_postgres_global_public_function_execute.sql"
      - "scripts/postgres-global-function-default-acl-regression.sql"
      - ".github/workflows/postgres-global-function-default-acl.yml"

permissions:
  contents: read

jobs:
  postgres-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bethag_acl_defaults
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bethag_acl_defaults"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Run isolated default-privilege regression
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bethag_acl_defaults
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/postgres-global-function-default-acl-regression.sql
