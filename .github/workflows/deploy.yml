name: Deploy BETHAG to GitHub Pages
# Automatic deployment workflow
# Production client configuration is injected at build time; the publishable
# key is designed for browser use and database access remains protected by RLS.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: bethag-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build BETHAG for Production
        env:
          VITE_SUPABASE_ENABLE: "true"
          VITE_SUPABASE_URL: https://tctcgptrsmvgajqjgnev.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_VTickP6SdwCWp-3oUNSleA_UuA307iJ
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}

# Launch verification trigger
