name: Temporary PostgreSQL read-only connectivity check
on:
  push:
    branches:
      - temp/postgres-readonly-connectivity-check
    paths:
      - .github/workflows/temp-postgres-readonly-connectivity-check.yml
permissions:
  contents: read
concurrency:
  group: bethag-temp-postgres-readonly-connectivity-check
  cancel-in-progress: true
jobs:
  connectivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Test Production PostgreSQL connection (read-only)
        env:
          DATABASE_URL: ${{ secrets.BETHAG_PROD_DATABASE_URL }}
          PGCONNECT_TIMEOUT: "15"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::Repository secret BETHAG_PROD_DATABASE_URL is missing or empty."
            exit 1
          fi
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -P pager=off -c "SELECT current_database() AS database, current_user AS role, current_setting('server_version') AS postgres_version, now() AS checked_at;"
