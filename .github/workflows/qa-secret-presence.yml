name: BETHAG QA secret validation
on:
  push:
    branches:
      - ops/qa-secret-validation-20261102
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate QA secrets and QA Auth endpoint
        shell: bash
        env:
          QA_URL: https://jhuyhlzzydcgghrzeexn.supabase.co
          QA_SERVICE_ROLE_KEY: ${{ secrets.BETHAG_QA_SERVICE_ROLE_KEY }}
          ADMIN_PASSWORD: ${{ secrets.BETHAG_QA_ADMIN_PASSWORD }}
          COLLABORATOR_PASSWORD: ${{ secrets.BETHAG_QA_COLLABORATOR_PASSWORD }}
          RESIDENT_PASSWORD: ${{ secrets.BETHAG_QA_RESIDENT_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$QA_URL" == "https://jhuyhlzzydcgghrzeexn.supabase.co" ]]
          for name in QA_SERVICE_ROLE_KEY ADMIN_PASSWORD COLLABORATOR_PASSWORD RESIDENT_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "Missing required secret: $name"; exit 1; fi
          done
          if [[ "$QA_SERVICE_ROLE_KEY" != eyJ* ]]; then
            echo "Service key format mismatch: expected legacy service_role JWT for QA project."
            exit 1
          fi
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 --header "apikey: $QA_SERVICE_ROLE_KEY" "$QA_URL/auth/v1/health")"
          if [[ "$code" != "200" ]]; then echo "QA Auth health endpoint returned HTTP $code."; exit 1; fi
          echo "PASS: all four secrets are present and the service key reached the designated QA Auth endpoint."
