name: BETHAG QA secret presence check
on:
  push:
    branches:
      - ops/qa-secret-validation-20261102
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check configured QA secrets
        env:
          QA_ADMIN: ${{ secrets.BETHAG_QA_ADMIN_PASSWORD }}
          QA_COLLABORATOR: ${{ secrets.BETHAG_QA_COLLABORATOR_PASSWORD }}
          QA_RESIDENT: ${{ secrets.BETHAG_QA_RESIDENT_PASSWORD }}
          QA_SERVICE_ROLE: ${{ secrets.BETHAG_QA_SERVICE_ROLE_KEY }}
        run: |
          test -n "$QA_ADMIN"
          test -n "$QA_COLLABORATOR"
          test -n "$QA_RESIDENT"
          test -n "$QA_SERVICE_ROLE"
          echo "All required QA secrets are configured."
