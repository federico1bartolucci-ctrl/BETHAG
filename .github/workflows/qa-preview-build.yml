name: BETHAG QA preview build

on:
  workflow_dispatch:
  push:
    branches:
      - qa/preview-environment-20261028

permissions:
  contents: read

concurrency:
  group: bethag-qa-preview-build
  cancel-in-progress: true

jobs:
  qa-preview:
    runs-on: ubuntu-latest
    environment:
      name: bethag-qa-preview
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate QA-only configuration
        env:
          VITE_SUPABASE_ENABLE: ${{ vars.VITE_SUPABASE_ENABLE }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test "$VITE_SUPABASE_ENABLE" = "true" || { echo "QA environment must set VITE_SUPABASE_ENABLE=true"; exit 1; }
          normalized_url="${VITE_SUPABASE_URL%/}"
          test "$normalized_url" = "https://srkucrdcoswlozifvztr.supabase.co" || { echo "QA URL missing or not the approved QA project"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "QA publishable key is missing"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Build BETHAG for QA
        env:
          VITE_SUPABASE_ENABLE: ${{ vars.VITE_SUPABASE_ENABLE }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Run isolated browser smoke test
        run: |
          npx playwright install --with-deps chromium
          node scripts/test-browser-public-smoke.mjs

      - name: Upload QA build artifact (not deployed to public Pages)
        uses: actions/upload-artifact@v4
        with:
          name: bethag-qa-preview-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
