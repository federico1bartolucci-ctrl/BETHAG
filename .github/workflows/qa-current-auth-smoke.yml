name: BETHAG current QA authenticated smoke
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Exact current CAP commit SHA to test"
        required: true
        type: string
env:
  VITE_SUPABASE_ENABLE: "true"
  VITE_SUPABASE_URL: "https://jhuyhlzzydcgghrzeexn.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_b4Dlsr6NlQAlmfEBf_br1A_6l_8tbLj"
concurrency:
  group: bethag-qa-shared-environment
  cancel-in-progress: false

jobs:
  authenticated-smoke:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted CAP branch
        uses: actions/checkout@v4
        with:
          ref: cap-consolidation-20261123
          fetch-depth: 1
          persist-credentials: false
      - name: Verify requested SHA is the current trusted CAP head
        env:
          EXPECTED_SHA: ${{ inputs.target_ref }}
        run: |
          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_ref must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          TRUSTED_SHA="$(git rev-parse HEAD)"
          echo "Requested SHA: $EXPECTED_SHA"
          echo "Trusted CAP head: $TRUSTED_SHA"
          test "$EXPECTED_SHA" = "$TRUSTED_SHA"
          git checkout --detach "$EXPECTED_SHA"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Checked-out SHA: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate target is the approved QA project
        run: |
          test "$VITE_SUPABASE_ENABLE" = "true" || { echo "QA must be explicitly enabled"; exit 1; }
          test "${VITE_SUPABASE_URL%/}" = "https://jhuyhlzzydcgghrzeexn.supabase.co" || { echo "Refusing any non-approved Supabase target"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "QA publishable key missing"; exit 1; }
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build against isolated QA
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local preview and run real authenticated role tests
        env:
          BETHAG_QA_ADMIN_PASSWORD: ${{ secrets.BETHAG_QA_ADMIN_PASSWORD }}
          BETHAG_QA_COLLABORATOR_PASSWORD: ${{ secrets.BETHAG_QA_COLLABORATOR_PASSWORD }}
          BETHAG_QA_RESIDENT_PASSWORD: ${{ secrets.BETHAG_QA_RESIDENT_PASSWORD }}
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/bethag-preview.log 2>&1 &
          echo $! > /tmp/bethag-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/BETHAG/ >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4173/BETHAG/ >/dev/null
          node scripts/test-browser-current-qa-auth.mjs
