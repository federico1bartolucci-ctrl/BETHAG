name: BETHAG build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Diagnostic — Production migration source gaps (known blocker)
        run: npm run audit:production-ledger
        continue-on-error: true

      - name: Build
        run: npm run build
