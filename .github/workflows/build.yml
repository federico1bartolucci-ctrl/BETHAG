name: BETHAG build

on:
  push:
    branches: ["main"]
  pull_request:

# Build auth certification and final collaudo both sign in with the same QA
# accounts. Serialize them to avoid refresh-token/session contention.
concurrency:
  group: bethag-qa-shared-environment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Reject invalid or duplicate migration versions
        run: node scripts/check-unique-migration-versions.mjs

      - name: Verify migration history reconciliation and clean database baseline
        run: npm run verify:baseline

      - name: Verify Production function security and ACL parity
        run: npm run verify:security-parity

      - name: Test fresh PostgreSQL bootstrap
        run: npm test

      - name: Test communication send authorization and publication guards
        run: npm run test:communication-guards

      - name: Build
        env:
          VITE_SUPABASE_URL: https://jhuyhlzzydcgghrzeexn.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_b4Dlsr6NlQAlmfEBf_br1A_6l_8tbLj
        run: npm run build

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run isolated public-login browser smoke test
        run: node scripts/test-browser-public-smoke.mjs

      - name: Certify real QA authentication and session persistence
        if: github.head_ref == 'recovery/qa-ledger-reconciliation-20261104' || github.head_ref == 'fix/qa-view-acl-parity-20261105'
        env:
          BETHAG_QA_BASE_URL: http://127.0.0.1:4173/BETHAG/
          BETHAG_QA_ADMIN_PASSWORD: ${{ secrets.BETHAG_QA_ADMIN_PASSWORD }}
          BETHAG_QA_COLLABORATOR_PASSWORD: ${{ secrets.BETHAG_QA_COLLABORATOR_PASSWORD }}
          BETHAG_QA_RESIDENT_PASSWORD: ${{ secrets.BETHAG_QA_RESIDENT_PASSWORD }}
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/bethag-qa-auth-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS "$BETHAG_QA_BASE_URL" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$BETHAG_QA_BASE_URL" >/dev/null || { cat /tmp/bethag-qa-auth-preview.log; exit 1; }
          node scripts/test-browser-current-qa-auth.mjs

      - name: Run authenticated QA edit/archive diagnostic
        # Full authenticated APP workflows are deferred to the dedicated final-collaudo workflow.
        if: github.head_ref == 'ops/qa-secret-validation-20261102' || github.head_ref == 'qa/retest-archive-sync-v6-20261102' || github.head_ref == 'recovery/qa-ledger-reconciliation-20261104'
        env:
          BETHAG_QA_BASE_URL: http://127.0.0.1:4173/BETHAG/
          BETHAG_QA_ADMIN_PASSWORD: ${{ secrets.BETHAG_QA_ADMIN_PASSWORD }}
          BETHAG_QA_COLLABORATOR_PASSWORD: ${{ secrets.BETHAG_QA_COLLABORATOR_PASSWORD }}
          BETHAG_QA_RESIDENT_PASSWORD: ${{ secrets.BETHAG_QA_RESIDENT_PASSWORD }}
          BETHAG_QA_SERVICE_ROLE_KEY: ${{ secrets.BETHAG_QA_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_b4Dlsr6NlQAlmfEBf_br1A_6l_8tbLj
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/bethag-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS "$BETHAG_QA_BASE_URL" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$BETHAG_QA_BASE_URL" >/dev/null || { cat /tmp/bethag-preview.log; exit 1; }
          node scripts/test-current-qa-browser-workflows.mjs
          node scripts/test-current-qa-navigation.mjs
          node scripts/test-browser-current-qa-auth.mjs

  postgres-bootstrap:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bethag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bethag_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Bootstrap baseline on real PostgreSQL 17
        run: node scripts/test-postgres-bootstrap.mjs
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: bethag_test

      - name: Create a separate database for chronological clean-install rehearsal
        run: createdb --host=localhost --port=5432 --username=postgres bethag_clean_install_test
        env:
          PGPASSWORD: postgres

      - name: Rehearse all 28 clean-install migrations in chronological order
        run: npm run test:clean-install
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bethag_clean_install_test

      - name: Rehearse portal registration upsert repair on isolated PostgreSQL 17
        run: node scripts/test-postgres-portal-registration-upsert.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bethag_clean_install_test

      - name: Create a separate empty database for guarded migration-runner rehearsal
        run: createdb --host=localhost --port=5432 --username=postgres bethag_runner_test
        env:
          PGPASSWORD: postgres

      - name: Execute all 19 real canonical migrations through the guarded runner on isolated PostgreSQL
        run: node scripts/test-canonical-cutover-runner.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bethag_runner_test

      - name: Verify incremental hardening catalog and ACL postconditions
        run: node scripts/test-postgres-incremental-hardening.mjs
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: bethag_test

      - name: Create isolated database for Production ACL draft rehearsal
        run: createdb --host=localhost --port=5432 --username=postgres bethag_acl_draft_test
        env:
          PGPASSWORD: postgres

      - name: Execute and assert Production ACL draft on isolated PostgreSQL 17
        run: node scripts/test-production-acl-draft.mjs
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: bethag_acl_draft_test

      - name: Rehearse forward-only PostgreSQL default ACL repair on isolated database
        run: createdb --host=localhost --port=5432 --username=postgres bethag_default_acl_repair_test && node scripts/test-postgres-default-acl-repair.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bethag_default_acl_repair_test
          PGPASSWORD: postgres
      - name: Rehearse forward-only trigger-function ACL repair on isolated PostgreSQL
        run: createdb --host=localhost --port=5432 --username=postgres bethag_trigger_acl_repair_test && node scripts/test-postgres-trigger-function-acl-repair.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bethag_trigger_acl_repair_test
          PGPASSWORD: postgres

      - name: Rehearse forward-only function and sequence default ACL repair on isolated PostgreSQL
        run: createdb --host=localhost --port=5432 --username=postgres bethag_function_sequence_acl_test && node scripts/test-postgres-function-sequence-default-acl-repair.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bethag_function_sequence_acl_test
          PGPASSWORD: postgres

      - name: Rehearse forward-only workspace member profile column on isolated PostgreSQL
        run: createdb --host=localhost --port=5432 --username=postgres bethag_workspace_member_data_test && node scripts/test-postgres-workspace-member-data-column.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bethag_workspace_member_data_test
          PGPASSWORD: postgres

      - name: Rehearse member-transfer transaction rollback on isolated PostgreSQL
        run: createdb --host=localhost --port=5432 --username=postgres bethag_transfer_rollback_test && node scripts/test-postgres-transfer-rollback.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bethag_transfer_rollback_test
          PGPASSWORD: postgres

      - name: Test collaborator module permission enforcement with RLS
        run: node scripts/test-collaborator-module-permissions.mjs
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: bethag_test

      - name: Rehearse DATABASE_URL and canonical ledger transaction on isolated PostgreSQL
        run: node scripts/test-canonical-cutover-ledger-rehearsal.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bethag_test

