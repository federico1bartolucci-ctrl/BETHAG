name: BETHAG build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Verify clean database baseline
        run: npm run verify:baseline

      - name: Test fresh PostgreSQL bootstrap
        run: npm test

      - name: Build
        run: npm run build
