name: BETHAG build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Verify migration history reconciliation and clean database baseline
        run: npm run verify:baseline

      - name: Verify Production function security and ACL parity
        run: npm run verify:security-parity

      - name: Test fresh PostgreSQL bootstrap
        run: npm test

      - name: Build
        run: npm run build

  postgres-bootstrap:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bethag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bethag_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Bootstrap baseline on real PostgreSQL 17
        run: node scripts/test-postgres-bootstrap.mjs
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: bethag_test

